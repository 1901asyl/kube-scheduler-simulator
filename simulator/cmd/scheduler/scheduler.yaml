apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
clientConnection:
  kubeconfig: "/config/kubeconfig.yaml"
profiles:
  - schedulerName: default-scheduler
    plugins:
      score:
        enabled:
          - name: AIScore
            weight: 10
      reserve:
        enabled:
          - name: AIScore
